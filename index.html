<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ronald Qiao</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --header-font: 'Instrument Serif', serif;
      --body-font: 'Newsreader', serif;
    }

    /* page basics */
    body {
      margin: 0;
      padding: 0 1rem;
      font-family: var(--body-font);
      font-size: 1.25rem;
      line-height: 1.6;
      color: #000;
    }

    /* header */
    header {
      text-align: center;
      margin: 2rem 0 6rem;
    }
    header h1 {
      font-family: var(--header-font);
      font-size: 1.5rem;
      margin: 0;
      font-weight: lighter;
    }

    /* content */
    p {
      max-width: 23rem;
      margin: 0 auto 2rem;
      font-weight: 50;
      font-size: 1rem;
      line-height: 1.2;
    }

    /* links */
    a {
      color: inherit;            /* keep default text colour */
      text-decoration: underline;
    }

    .name-preview-trigger {
      cursor: default;
      text-decoration: underline;
      text-decoration-thickness: 0.05em;
      text-underline-offset: 0.12em;
    }

    .name-preview {
      position: fixed;
      width: min(18rem, calc(100vw - 2rem));
      max-height: calc(100vh - 2rem);
      object-fit: contain;
      border-radius: 0.35rem;
      box-shadow: 0 1.1rem 2.8rem rgba(0, 0, 0, 0.22), 0 0.35rem 0.9rem rgba(0, 0, 0, 0.14);
      opacity: 0;
      pointer-events: none;
      transform: translate3d(0, 0, 0) scale(0.98);
      transition: opacity 120ms ease, transform 120ms ease;
      z-index: 10;
    }

    .name-preview.is-visible {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }
  </style>
</head>
<body>

  <header>
    <!-- link could point to "/" later – left empty for now -->
    <h1><a href="" style="text-decoration:none;">Ronald Qiao</a></h1>
  </header>

  <main>
    <p>
      Incoming freshman @ <a href="https://www.yale.edu/">Yale</a>. Investment team intern @ <a href="https://www.8vc.com/">8VC</a>. My Chinese name is <span class="name-preview-trigger" tabindex="0" aria-describedby="name-preview">若渊</span> (ruòyuān). Past:
    </p>
    <p>
      <a href="https://www.exeter.edu" target="_blank" rel="noopener noreferrer">
        Phillips Exeter Academy</a> '26
    </p>
    <p>
      <a href="https://rossprogram.org" target="_blank" rel="noopener noreferrer">
        Ross Indiana</a> '24, '25
    </p>
    <p>Email: ronaldqiao7 [at] gmail.com, <br>ronald.qiao [at] yale.edu</p>

  </main>

  <img id="name-preview" class="name-preview" src="the-manneport-etretat.jpg" alt="The Manneport, Etretat" />

  <script>
    const nameTrigger = document.querySelector('.name-preview-trigger');
    const namePreview = document.querySelector('#name-preview');
    const previewOffset = 18;

    function positionPreview(event) {
      const triggerRect = nameTrigger.getBoundingClientRect();
      const pointerX = event.clientX ?? triggerRect.right;
      const pointerY = event.clientY ?? triggerRect.top;
      const previewRect = namePreview.getBoundingClientRect();
      const maxX = window.innerWidth - previewRect.width - previewOffset;
      const maxY = window.innerHeight - previewRect.height - previewOffset;
      const x = Math.max(previewOffset, Math.min(pointerX + previewOffset, maxX));
      const y = Math.max(previewOffset, Math.min(pointerY + previewOffset, maxY));

      namePreview.style.left = `${x}px`;
      namePreview.style.top = `${y}px`;
    }

    function showPreview(event) {
      positionPreview(event);
      namePreview.classList.add('is-visible');
    }

    function hidePreview() {
      namePreview.classList.remove('is-visible');
    }

    nameTrigger.addEventListener('mouseenter', showPreview);
    nameTrigger.addEventListener('mousemove', positionPreview);
    nameTrigger.addEventListener('mouseleave', hidePreview);
    nameTrigger.addEventListener('focus', showPreview);
    nameTrigger.addEventListener('blur', hidePreview);
  </script>

</body>
</html>
